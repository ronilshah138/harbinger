name: CI/CD Pipeline

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  backend-lint-test:
    name: Backend CI
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f harbinger/backend/requirements.txt ]; then
            pip install -r harbinger/backend/requirements.txt
          fi

      - name: Syntax check
        run: |
          python -m py_compile harbinger/backend/app/*.py

  frontend-build:
    name: Frontend CI
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'
          cache-dependency-path: harbinger/frontend/package.json

      - name: Install dependencies
        run: |
          cd harbinger/frontend
          npm ci

      - name: Build project
        run: |
          cd harbinger/frontend
          npm run build
